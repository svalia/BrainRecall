<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BrainRecall</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="br.css" />
  <style>
    @font-face {
      font-family: 'Golos Text';
      src: url('assets/fonts/GolosText-Variable.woff2') format('woff2');
      font-weight: 400 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Literata';
      src: url('assets/fonts/Literata-SemiBold.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Literata';
      src: url('assets/fonts/Literata-Italic.woff2') format('woff2');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg, #F3F2EE);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #app-shell.ph {
      width: 100%;
      height: 100%;
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .device-safe-top {
      height: var(--tg-safe-top, env(safe-area-inset-top, 0px));
      flex: none;
    }

    .telegram-content-safe {
      height: var(--tg-content-safe-top, 0px);
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-grabber {
      width: 38px;
      height: 5px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--mu) 38%, transparent);
      margin: 6px auto 2px;
      flex: none;
    }

    #screen-viewport {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 12px 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .device-safe-bottom {
      height: var(--tg-safe-bottom, env(safe-area-inset-bottom, 10px));
      flex: none;
    }

    /* Sheet system sizes per Section 3.12 */
    #sheet-root {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      display: none;
    }
    #sheet-root.open {
      display: block;
      pointer-events: auto;
    }
    #sheet-scrim {
      position: absolute;
      inset: 0;
      background: var(--scr, rgba(15, 15, 12, 0.42));
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #sheet-root.open #sheet-scrim {
      opacity: 1;
    }
    #sheet-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      border-radius: 28px 28px 0 0;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.22);
      display: flex;
      flex-direction: column;
      max-height: 90%;
      transform: translateY(100%);
      transition: transform 0.24s cubic-bezier(0.2, 0.85, 0.25, 1);
      padding-bottom: var(--tg-safe-bottom, env(safe-area-inset-bottom, 12px));
    }
    #sheet-root.open #sheet-panel {
      transform: translateY(0);
    }
    #sheet-panel.small { max-height: 46%; }
    #sheet-panel.medium { max-height: 68%; }
    #sheet-panel.large { max-height: 88%; }

    #sheet-header {
      padding: 10px 18px 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: grab;
      touch-action: none;
    }
    #sheet-body {
      padding: 6px 18px 18px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Gestures-Back edge drop indicator per Section 3.13 & Delta 1.1 */
    #edge-back-indicator {
      position: absolute;
      top: 50%;
      width: 44px;
      height: 68px;
      margin-top: -34px;
      z-index: 90;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
      display: grid;
      place-items: center;
    }
    #edge-back-indicator.left {
      left: 0;
      border-radius: 0 34px 34px 0;
    }
    #edge-back-indicator.right {
      right: 0;
      border-radius: 34px 0 0 34px;
    }
    #edge-back-indicator .drop-pill {
      width: 38px;
      height: 56px;
      border-radius: 28px;
      background: var(--sf2);
      color: var(--mu);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16), inset 0 0 0 1.5px var(--ln);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 22px;
      transition: background 0.12s ease, color 0.12s ease, transform 0.1s ease;
    }
    #edge-back-indicator.armed .drop-pill {
      background: var(--tx);
      color: var(--bg);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.26);
    }

    input, textarea {
      user-select: text;
    }
  </style>
</head>
<body>
  <div id="app-shell" class="ph nl">
    <div class="device-safe-top"></div>
    <div class="telegram-content-safe">
      <div class="app-grabber" aria-hidden="true"></div>
    </div>

    <!-- Offline banner -->
    <div id="offline-banner" class="bn er" style="display:none; margin: 4px 16px 0; flex:none;">
      <span id="offline-banner-text">Нет соединения с сетью</span>
    </div>

    <!-- Main scrollable screen area -->
    <main id="screen-viewport" role="main"></main>

    <!-- Bottom navigation bar (shown on primary screens D03/D04/D19/D24) -->
    <nav id="bottom-nav" class="tb" style="display:none;" aria-label="Primary Navigation">
      <a href="#D03" class="tab on" data-nav="D03">
        <i class="ic" data-i="nav-today"></i>
        <span data-i18n="miniapp.nav.today">Сегодня</span>
      </a>
      <a href="#D04" class="tab" data-nav="D04">
        <i class="ic" data-i="nav-knowledge"></i>
        <span data-i18n="miniapp.nav.knowledge">Знания</span>
      </a>
      <a href="#D19" class="tab" data-nav="D19">
        <i class="ic" data-i="nav-habits"></i>
        <span data-i18n="miniapp.nav.habits">Привычки</span>
      </a>
      <a href="#D24" class="tab" data-nav="D24">
        <i class="ic" data-i="nav-progress"></i>
        <span data-i18n="miniapp.nav.progress">Прогресс</span>
      </a>
    </nav>

    <div class="device-safe-bottom"></div>

    <!-- Reusable Bottom Sheet (.small / .medium / .large) -->
    <div id="sheet-root" aria-hidden="true">
      <div id="sheet-scrim"></div>
      <div id="sheet-panel" class="medium" role="dialog" aria-modal="true">
        <div id="sheet-header">
          <div class="grab"></div>
          <div class="row sp" style="padding-top:4px;">
            <h2 id="sheet-title" class="h2"></h2>
            <button id="sheet-close-btn" type="button" class="btn b2 bsm" style="min-height:36px; padding:6px 14px;"></button>
          </div>
        </div>
        <div id="sheet-body"></div>
      </div>
    </div>

    <!-- Edge-Back Gesture Drop Indicator (Left & Right edges) -->
    <div id="edge-back-indicator" class="left" aria-hidden="true">
      <div class="drop-pill">‹</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
